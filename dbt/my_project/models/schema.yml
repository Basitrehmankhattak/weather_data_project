version: 2

models:
  - name: stg_weather_data
    description: "Cleaned and deduplicated weather records normalized to local timestamps."
    columns:
      - name: id
        description: "Primary key from raw_weather_data."
        data_tests:
          - unique
          - not_null
      - name: city
        data_tests:
          - not_null
      - name: weather_time_local
        data_tests:
          - not_null

  - name: weather_report
    description: "Reporting table containing cleaned weather metrics for Grafana time-series visualization."
    columns:
      - name: city
        data_tests:
          - not_null
      - name: temperature
        data_tests:
          - not_null
      - name: wind_speed
        data_tests:
          - not_null
      - name: weather_time_local
        data_tests:
          - not_null

  - name: daily_average
    description: "Daily aggregated average temperature and wind speed per city."
    columns:
      - name: city
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: avg_temperature
        data_tests:
          - not_null
      - name: avg_wind_speed
        data_tests:
          - not_null